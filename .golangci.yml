version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
  settings:
    errcheck:
      # Writes to the terminal and closing files that were only read cannot
      # fail in a way the program could act on.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - (*go.etcd.io/bbolt.DB).Close
        - (github.com/hidetzu/reelwarden/internal/cache.Store).Close
    gosec:
      excludes:
        - G204 # subprocess with variable args: ffmpeg/ffprobe paths are user-chosen and passed as argv, never via a shell
        - G304 # file inclusion via variable: reading user-selected files is the purpose of the tool
        - G115 # integer conversions of OS identity fields are intentional
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
      - path: internal/testutil/
        linters: [errcheck, gosec]
formatters:
  enable:
    - gofmt
